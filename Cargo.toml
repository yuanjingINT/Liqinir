[package]
name = "liqinir"
version = "0.1.0"
edition = "2024"
description = "A Rust event core and glass island for DMS / niri"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1.0"
futures-util = "0.3"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["rt", "macros", "net", "io-util", "sync", "time", "signal", "process", "fs"] }
toml = "1.1"
zbus = { version = "5.18", default-features = false, features = ["tokio"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = "s"
