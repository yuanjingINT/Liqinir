# Liqinir · Kitty liquid-glass profile
# Included after the Noctalia palette so palette refreshes do not reset glass.
# Kitty keeps glyphs opaque while the compositor blends the terminal surface.

background_opacity 0.66
background_blur 32
dynamic_background_opacity yes

window_padding_width 14
hide_window_decorations yes
inactive_text_alpha 1.0

# Keep the tab strip part of the same translucent surface.
tab_bar_background none
